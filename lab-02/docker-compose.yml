services:
  web:
    build: .
    container_name: flask_web
    restart: always
    ports:
      - "${APP_PORT}:5000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - redis_storage
    networks:
      - backend_network
  
  redis_storage:
    image: redis:alpine
    container_name: redis_db
    restart: always
    command: redis-server --appendonly yes # Включаем AOF (сброс каждой записи на диск)
    volumes:
      - redis_data:/data                   # Монтируем виртуальный том в папку базы
    networks:
      - backend_network

volumes:
  redis_data:                              # Докер сам создаст и будет хранить эту папку на хосте

networks:
  backend_network:
    driver: bridge
